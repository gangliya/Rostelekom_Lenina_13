<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система мониторинга - Вход</title>
    <link rel="icon" href="/static/images/logo_full.png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; overflow: hidden; }
        .bg { background: #7e00ff; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .top-logo { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; color: white; font-size: 24px; font-weight: bold; }
        .top-logo img { height: 40px; margin-right: 10px; }
        
        .login-card { background: white; width: 400px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: left; }
        .card-header { display: flex; align-items: center; margin-bottom: 30px; }
        .card-header img { height: 60px; margin-right: 15px; }
        .card-header h2 { font-size: 22px; margin: 0; line-height: 1.2; }
        
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: #f8f9ff; }
        
        button { width: 100%; padding: 12px; background: #2b65e2; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #1a4db3; }
        
        .footer-text { margin-top: 20px; font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="bg">
        <div class="top-logo">
            <img src="/static/images/logo_white.png" alt=""> Ростелеком
        </div>
        
        <div class="login-card">
            <div class="card-header">
                <img src="/static/images/logo_full.png" alt="">
                <h2>Система<br>мониторинга сети</h2>
            </div>
            
            <label>Логин</label>
            <input type="text" id="login" placeholder="Введите логин">
            
            <label>Пароль</label>
            <input type="password" id="pass" placeholder="Введите пароль">
            
            <button onclick="doLogin()">Войти</button>
            
            <div class="footer-text">
                В случае возникновения вопросов, просьба согласовывать действия с руководством
            </div>
        </div>
    </div>

    <script>
        function doLogin() {
            const login = document.getElementById('login').value;
            const password = document.getElementById('pass').value;

            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({login, password})
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') window.location.href = '/dashboard';
                else alert(data.message);
            });
        }
    </script>
</body>
</html>
